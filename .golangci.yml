version: "2"
run:
  build-tags:
    - integration
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - funcorder
    - gochecknoinits
    - noinlineerr # Error handling in Go already takes 3 lines, why would we want to make it 4 ???
  settings:
    cyclop:
      max-complexity: 15
    funlen:
      lines: 110
      statements: 70
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    godot:
      capital: true
    gomoddirectives:
      replace-allow-list:
        - gopkg.in/mattn/go-runewidth.v0
        - gopkg.in/mattn/go-isatty.v0
        - gopkg.in/mattn/go-colorable.v0
    govet:
      disable:
        - fieldalignment
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 140
    misspell:
      locale: UK
    tagliatelle:
      case:
        rules:
          json: snake
    unparam:
      check-exported: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - status.Error(
  exclusions:
    generated: lax
    rules:
      - linters:
          - bodyclose
          - dupl
          - dupword
          - errcheck
          - errchkjson
          - forcetypeassert
          - funlen
          - gochecknoglobals
          - goconst
          - gocritic
          - gosec
          - govet
          - lll
          - maintidx
          - revive
          - unparam
          - varnamelen
          - wrapcheck
        path: _test\.go
      - linters:
          - errcheck
        path: testing
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - model
      - tmp
      - bin
      - scripts
      - third_party$
      - builtin$
      - examples$
issues:
  new-from-rev: 3a9c0e0a6e0854ca0b30f4a82cf6113ee53e443d
  fix: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/lzambarda/hbt
  exclusions:
    generated: lax
    paths:
      - model
      - tmp
      - bin
      - scripts
      - third_party$
      - builtin$
      - examples$
